# Local PostgreSQL 16 for the BI workload. The admin credentials below are for a throwaway local container only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent_admin
      POSTGRES_PASSWORD: agent_admin_local
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_admin"]
      interval: 2s
      retries: 30
# Then: export AGENT_SQL_PG_ADMIN_URL=postgresql://agent_admin:agent_admin_local@localhost:5432/postgres
#       python3 -m bi_dataset.generate --instance dev && python3 -m bi_dataset.load_postgres --instance dev
