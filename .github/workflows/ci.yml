name: spec-and-tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Spec consistency gate (phase-0 gate spec-check)
        run: python3 scripts/check_spec.py
      - name: Spec tests (phase-0 gate spec-tests)
        run: python3 -m unittest discover -s tests/spec -v
      - name: Cross-validate contracts and frontier with ai-native-engineering (pinned)
        run: |
          git clone --quiet https://github.com/asapacsin/ai-native-engineering /tmp/ai-native
          git -C /tmp/ai-native checkout --quiet 1a161b849e6faaca9678c6e35c7e730d33e12ac0
          for c in docs/spec/contracts/*.json; do
            python3 /tmp/ai-native/scripts/ai_native.py validate --contract "$c"
          done
          python3 /tmp/ai-native/scripts/frontier.py check --registry docs/spec/work.json
  phase1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_admin
          POSTGRES_PASSWORD: agent_admin_local
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent_admin" --health-interval 2s --health-retries 30
    env:
      AGENT_SQL_PG_ADMIN_URL: postgresql://agent_admin:agent_admin_local@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Generate and load RetailCo-dev
        run: |
          python3 -m bi_dataset.generate --instance dev
          python3 -m bi_dataset.load_postgres --instance dev
      - name: Phase 1 gates (live gate BLOCKED without credentials)
        run: python3 scripts/run_gates.py --phase 1 --block "live-smoke-b0=no Anthropic credential in CI"
